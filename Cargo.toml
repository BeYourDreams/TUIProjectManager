[package]
name = "tui-project-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26"
# 读剪贴板 CF_HDROP（资源管理器复制文件后的文件列表）；已是 arboard 的传递依赖，直接声明零新增编译。
clipboard-win = "5.4"
# 渲染后端：renderer 与 backends 全不指定，交给系统。eframe 默认走 wgpu，
# 后端集合 PRIMARY|GL（Windows 上 DX12 → Vulkan → GL 依序试），适配器由 wgpu
# 挑（独显 → 核显 → WARP，即系统自带的 CPU 软件光栅器）。glow 只作 wgpu 整个
# 起不来时的重试路径。某台机器上厂商 ICD 一加载就崩时设 WGPU_BACKENDS=dx12。
# 不启 default_fonts（省 Ubuntu+NotoEmoji ~15MB）：基础字体用内嵌 HACK，见 setup_fonts。
eframe = { version = "0.36.1", default-features = false, features = ["glow", "wgpu"] }
fontdue = "0.9"
portable-pty = "0.9"
raw-window-handle = "0.6"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
epaint_default_fonts = "0.36.1" # 内嵌 HACK 作为基础字体（替代 egui default_fonts，无 emoji，省 ~15MB）

[build-dependencies]
winres = "0.1"

# 开发迭代：自己代码轻优化，依赖全优化 → 编译快、运行不卡。
[profile.dev]
opt-level = 1
# 只留行号级别的调试信息：体积缩小约 5 倍，backtrace 仍可用
# （真实调完再开 debug = 2 用 gdb/lldb 看变量）。
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3

# 精简产物：全量链接 + 去符号。opt-level 用 3 而非 z：终端逐格渲染是热循环，
# z 的体积/对齐取舍实测明显慢；3 比 2 多开向量化和更好的循环展开（build_snapshot
# 的逐格 hash_mix / memcpy、以及 egui 遍历），代价只是构建更慢、产物略大。
# 不用 panic=abort：页签崩溃隔离要靠 catch_unwind 捕获 UI 线程 panic，
# abort 模式下任何 panic 直接杀进程，无法做到“一个页签崩不影响整个软件”。
[profile.release]
opt-level = 3
codegen-units = 1
lto = true
strip = true

[patch.crates-io]
getrandom = { path = "vendor/getrandom-0.4.3" }
# 上游 0.26.0 bug：push_keyboard_mode 超深时误删 title_stack（空栈 remove(0) 直接 panic），
# 触发场景：全屏 TUI 反复 push kitty 键盘模式 > TITLE_STACK_MAX_DEPTH。本地修正为删 keyboard_mode_stack。
alacritty_terminal = { path = "vendor/alacritty_terminal-0.26.0" }

[dev-dependencies]
